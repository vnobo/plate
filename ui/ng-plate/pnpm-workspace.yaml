overrides:
  # Angular 22.2.3 的 compiler-cli 声明 ^1.4.14，但其 bundle 用到只有 1.6.0 才有的 encodeRangeMappings
  '@jridgewell/sourcemap-codec': ^1.6.0
  # express 5.3.0 仍把 body-parser 钉在 2.3.0（含 DoS 漏洞），SSR 入站请求路径上需升到 2.4.0
  body-parser: ^2.4.0
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
