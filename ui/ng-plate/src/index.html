<!doctype html>
<html lang="zh-Hans" data-bs-navbar-position="combined" data-season="spring">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
    <title>Plate Web Console</title>
    <base href="/"/>

    <!-- Primary Meta Tags -->
    <meta content="Plate Web Console" name="title"/>
    <meta content="Plate Web Console - A modern web management console" name="description"/>
    <meta content="alexbob" name="author"/>
    <meta content="Web console, dashboard, admin panel, management system" name="keywords"/>

    <!-- Security Meta Tags -->
    <meta content="1; mode=block" http-equiv="x-ua-compatible"/>

    <!-- PWA Meta Tags -->
    <meta content="#ffffff" name="theme-color"/>
    <meta content="yes" name="mobile-web-app-capable"/>
    <meta content="Plate Web Console" name="application-name"/>

    <!-- Apply the saved season before stylesheets load to avoid a first-paint flash.
         Keep this below the theme-color meta so it can be updated on first paint.
         Default is spring; a stored, valid choice wins. Guarded so private-mode
         storage failures cannot break the page. -->
    <script>
        (function () {
            try {
                var season = localStorage.getItem('theme');
                if (['spring', 'summer', 'autumn', 'winter'].indexOf(season) !== -1) {
                    document.documentElement.setAttribute('data-season', season);
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) {
                        meta.setAttribute('content', {
                            spring: '#f9faf7', summer: '#f7fbfe',
                            autumn: '#f8f4ee', winter: '#ffffff'
                        }[season]);
                    }
                }
            } catch (e) { /* storage unavailable: keep the spring default */ }
        })();
    </script>
    <meta content="yes" name="apple-mobile-web-app-capable"/>
    <meta content="default" name="apple-mobile-web-app-status-bar-style"/>
    <meta content="Plate Web Console" name="apple-mobile-web-app-title"/>

    <!-- Performance Meta Tags -->
    <meta content="no-cache, no-store, must-revalidate" http-equiv="content-type"/>
    <meta content="telephone=no, date=no, email=no, address=no" name="format-detection"/>

    <!-- Favicon -->
    <link href="/favicon.ico" rel="icon" type="image/x-icon"/>

    <!-- Preconnect to External Resources -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link crossorigin="" href="https://cdnjs.cloudflare.com" rel="preconnect"/>

    <!-- Fonts with display=swap for better performance -->
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap"
            rel="stylesheet"
    />
    <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&amp;display=swap"
            rel="stylesheet"
    />
    <!-- LXGW WenKai -->
    <link href="https://cdn.jsdelivr.net/npm/@callmebill/lxgw-wenkai-web@latest/style.css" rel="stylesheet"/>
    <!-- PWD Manifest -->
    <link href="manifest.webmanifest" rel="manifest"/>
</head>
<body>
<app-root>
    <div class="page page-center">
        <div class="container container-slim py-4">
            <div class="text-center">
                <div class="mb-3">
                    <a class="navbar-brand navbar-brand-autodark" href="."
                    ><img alt="Plate" height="96" src="./icons/icon-96x96.png"
                    /></a>
                </div>
                <div class="text-secondary mb-3">Preparing application</div>
                <div class="progress progress-sm">
                    <div class="progress-bar progress-bar-indeterminate"></div>
                </div>
            </div>
        </div>
    </div>
</app-root>
<noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
