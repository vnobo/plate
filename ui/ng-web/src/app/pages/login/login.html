<div class="page page-center">
  <div class="login-container">
    <!-- Brand -->
    <div class="login-brand">
      <img ngSrc="favicon.ico" width="42" height="42" alt="Logo" class="navbar-brand-image" />
      <h1 class="login-brand-name">NgWeb</h1>
    </div>

    <div class="card card-login">
      <div class="card-body">
        <h2 class="card-title">登录</h2>
        <p class="text-secondary mb-4">请输入您的账号信息以继续</p>

        <!-- 错误提示 -->
        @if (loginError()) {
          <div class="alert alert-danger" role="alert">
            {{ loginError() }}
          </div>
        }

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off">
          <!-- 用户名 -->
          <div class="mb-3">
            <label class="form-label" for="username">用户名</label>
            <div class="input-icon">
              <span class="input-icon-addon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" class="icon">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </span>
              <input
                id="username"
                class="form-control"
                type="text"
                formControlName="username"
                placeholder="请输入用户名"
                autocomplete="username"
                [class.is-invalid]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid"
              />
            </div>
            @if (getFieldError('username')) {
              <div class="invalid-feedback">{{ getFieldError('username') }}</div>
            }
          </div>

          <!-- 密码 -->
          <div class="mb-3">
            <label class="form-label" for="password">密码</label>
            <div class="input-icon">
              <span class="input-icon-addon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" class="icon">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
              <input
                id="password"
                class="form-control"
                [type]="showPassword() ? 'text' : 'password'"
                formControlName="password"
                placeholder="请输入密码"
                autocomplete="current-password"
                [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
              />
              <span class="input-icon-addon input-icon-addon-end cursor-pointer"
                (click)="togglePasswordVisibility()" (keydown.enter)="togglePasswordVisibility()"
                tabindex="0" role="button" [attr.aria-label]="showPassword() ? '隐藏密码' : '显示密码'">
                @if (showPassword()) {
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="icon">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                    <line x1="1" y1="1" x2="23" y2="23" />
                  </svg>
                } @else {
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="icon">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                }
              </span>
            </div>
            @if (getFieldError('password')) {
              <div class="invalid-feedback">{{ getFieldError('password') }}</div>
            }
          </div>

          <!-- 记住我 & 忘记密码 -->
          <div class="mb-3 d-flex justify-content-between align-items-center">
            <label class="form-check">
              <input class="form-check-input" type="checkbox" formControlName="rememberMe" />
              <span class="form-check-label">记住我</span>
            </label>
            <a href="javascript:void(0)" class="text-secondary text-decoration-none" tabindex="-1">忘记密码？</a>
          </div>

          <!-- 登录按钮 -->
          <div class="form-footer">
            <button
              class="btn btn-primary w-100"
              type="submit"
              [disabled]="isSubmitting() || isLoading()">
              @if (isSubmitting()) {
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                正在登录...
              } @else {
                登录
              }
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 背景装饰点 -->
  <div class="bg-decoration">
    @for (i of [1, 2, 3, 4, 5]; track i) {
      <span></span>
    }
  </div>
</div>
