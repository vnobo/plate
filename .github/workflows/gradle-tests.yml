name: Gradle Integration Test

run-name: ${{ github.actor }} is running integration tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: gradle-integration-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx2g"

jobs:
  integration-test:
    name: Testcontainers Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "liberica"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Spring Boot Tests
        run: |
          cd boot && chmod +x ./gradlew
          ./gradlew test --scan --info

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spring-boot-test-reports
          path: |
            boot/platform/build/reports/tests/
            boot/platform/build/test-results/
          retention-days: 14

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Spring Boot Test Results
          path: boot/platform/build/test-results/**/*.xml
          reporter: java-junit
          fail-on-error: false
