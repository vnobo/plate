name: Gradle Build Image

run-name: ${{ github.repository_owner }} is building boot image

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  release:
    types: [created]

env:
  GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}
  DOCKERHUB_REGISTRY: docker.io/alexbob
  IMAGE_NAME: plate-platform

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ---- Checkout & Toolchain ----
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "liberica"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # ---- Docker Cross-Platform Prerequisites ----

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ---- Version Extraction ----
      - name: Extract project version from Gradle
        id: version
        run: |
          VERSION=$(grep '^version=' boot/gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      # ---- Registry Authentication ----
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---- Docker Metadata (tags, labels, annotations) ----

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          flavor: |
            latest=false
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # ---- Build & Push Single-Arch Images to GHCR ----

      #- name: Build and Push amd64 Image
      #  run: |
      #    cd boot && chmod +x ./gradlew
      #    ./gradlew bootBuildImage \
      #      --imageName=${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-amd64 \
      #      --imagePlatform=linux/amd64 \
      #      --network=host \
      #      --publishImage --scan
      #
      #- name: Build and Push arm64 Image
      #  run: |
      #    cd boot
      #    ./gradlew bootBuildImage \
      #      --imageName=${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-arm64 \
      #      --imagePlatform=linux/arm64 \
      #      --network=host \
      #      --publishImage --scan

      # ---- Create Multi-Arch Manifest for GHCR ----
      - name: Create and Push GHCR Multi-Arch Manifest
        run: |
          GHCR_TAGS=""
          while IFS= read -r tag; do
            [[ -n "$tag" && "$tag" == ghcr.io/* ]] && GHCR_TAGS="$GHCR_TAGS --tag $tag"
          done <<< "${{ steps.meta.outputs.tags }}"

          ANNOTATIONS=""
          while IFS= read -r ann; do
            [[ -n "$ann" ]] && ANNOTATIONS="$ANNOTATIONS --annotation ${ann#manifest:}"
          done <<< "${{ steps.meta.outputs.annotations }}"

          echo "${{ secrets.PAGK_TOKEN }}" | docker login -u ${{ github.actor }} --password-stdin ghcr.io

          docker buildx imagetools create \
            $ANNOTATIONS \
            $GHCR_TAGS \
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-amd64 \
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-arm64

      # ---- Copy Single-Arch Images to Docker Hub ----
      - name: Copy single-arch images to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin docker.io
          docker buildx imagetools create \
            --tag ${{ env.DOCKERHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-amd64 \
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-amd64
          docker buildx imagetools create \
            --tag ${{ env.DOCKERHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-arm64 \
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-arm64

      # ---- Create Multi-Arch Manifest for Docker Hub ----

      - name: Create and Push Docker Hub Multi-Arch Manifest
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin docker.io
          DOCKERHUB_TAGS=""
          while IFS= read -r tag; do
            [[ -n "$tag" && "$tag" == docker.io/* ]] && DOCKERHUB_TAGS="$DOCKERHUB_TAGS --tag $tag"
          done <<< "${{ steps.meta.outputs.tags }}"

          ANNOTATIONS=""
          while IFS= read -r ann; do
            [[ -n "$ann" ]] && ANNOTATIONS="$ANNOTATIONS --annotation ${ann#manifest:}"
          done <<< "${{ steps.meta.outputs.annotations }}"

          docker buildx imagetools create \
            $ANNOTATIONS \
            $DOCKERHUB_TAGS \
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-amd64 \
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-arm64

      # ---- Verification ----

      - name: Verify multi-arch manifests
        if: always()
        run: |
          echo "=== GHCR Manifest ==="
          docker buildx imagetools inspect ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>/dev/null || true
          echo ""
          echo "=== Docker Hub Manifest ==="
          docker buildx imagetools inspect ${{ env.DOCKERHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>/dev/null || true
