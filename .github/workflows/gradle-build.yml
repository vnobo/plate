# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle
name: Gradle Build Image
run-name: ${{ github.actor }} is Build Boot Image Actions
on:
  push:
    branches:
      - "main"
      - "dev"
    tags:
      - "v*"
  release:
    types: [created]
env:
  GITHUB_REGISTRY: ghcr.io/${{ github.actor }}
  DOCKER_REGISTRY: docker.io/alexbob
jobs:
  boot-build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v4
      - name: Set up java 25 for x64
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "liberica"
          cache: "gradle"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Extract project version from Gradle
        id: version
        run: |
          VERSION=$(grep '^version=' boot/gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"
      - name: Log into registry ${{ env.GITHUB_REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PAGK_TOKEN }}
      - name: Build and Push amd64 Image
        run: |
          cd boot
          chmod +x ./gradlew
          ./gradlew bootBuildImage \
            --imageName=${{ env.GITHUB_REGISTRY }}/plate-platform:staging-amd64 \
            --imagePlatform=linux/amd64 \
            --network=host \
            --publishImage --scan
      - name: Build and Push arm64 Image
        run: |
          cd boot
          ./gradlew bootBuildImage \
            --imageName=${{ env.GITHUB_REGISTRY }}/plate-platform:staging-arm64 \
            --imagePlatform=linux/arm64 \
            --network=host \
            --publishImage --scan
      - name: Log into registry ${{ env.DOCKER_REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract platform metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          flavor: |
            latest=true
          images: |
            ${{ env.GITHUB_REGISTRY }}/plate-platform
            ${{ env.DOCKER_REGISTRY }}/plate-platform
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=tag
      - name: Create and Push Multi-Arch Manifest
        if: github.event_name != 'pull_request'
        run: |
          TAGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAGS="$TAGS --tag $tag"
          done <<< "${{ steps.meta.outputs.tags }}"
          ANNOTATIONS=""
          while IFS= read -r ann; do
            [ -n "$ann" ] && ANNOTATIONS="$ANNOTATIONS --annotation $ann"
          done <<< "${{ steps.meta.outputs.annotations }}"
          docker buildx imagetools create \
            --provenance=false \
            $ANNOTATIONS \
            $TAGS \
            ${{ env.GITHUB_REGISTRY }}/plate-platform:staging-amd64 \
            ${{ env.GITHUB_REGISTRY }}/plate-platform:staging-arm64
      - name: Verify multi-arch manifest
        if: always()
        run: |
          docker buildx imagetools inspect ${{ env.GITHUB_REGISTRY }}/plate-platform:latest 2>/dev/null || true
