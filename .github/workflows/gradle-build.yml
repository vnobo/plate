name: Gradle Build Code

run-name: ${{ github.repository_owner }} is building boot code

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: gradle-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.jvmargs="-Dfile.encoding=UTF-8 -Xmx2g"

jobs:
  build-boot-code:
    name: Build & Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "liberica"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Boot Code
        run: |
          cd boot && chmod +x ./gradlew
          ./gradlew build -x test --scan

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: plate-platform-jars
          path: boot/platform/build/libs/*.jar
          retention-days: 5
          if-no-files-found: error

      - name: Upload build report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-failure-reports
          path: boot/platform/build/reports/
          retention-days: 7
